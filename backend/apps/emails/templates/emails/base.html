<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{% block title %}KOMI{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #eceef1;">
          <tr>
            <td style="padding:32px 40px 24px;">
              <img src="{{ frontend_url }}/assets/logos/logo-horizontal.svg" alt="KOMI" width="120" style="display:block;height:auto;">
            </td>
          </tr>
          <tr>
            <td style="padding:8px 40px 40px;color:#374151;font-size:15px;line-height:1.65;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px;background-color:#fafafa;border-top:1px solid #eceef1;color:#9ca3af;font-size:12px;line-height:1.6;">
              <p style="margin:0 0 4px;">KOMI — Le moyen le plus simple de vendre en ligne.</p>
              <p style="margin:0;">Vous recevez cet email car vous avez un compte ou avez passé commande sur KOMI.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
